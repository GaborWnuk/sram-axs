# Release: publish @gaborwnuk/axs-core to npm and cut a GitHub release.
#
# Triggered by pushing a version tag:
#
#     npm version minor --workspace=@gaborwnuk/axs-core   # bumps package.json
#     git commit -am "release: axs-core 0.2.0"
#     git tag v0.2.0 && git push origin main --tags
#
# Publishing and releasing are two jobs rather than two workflows on purpose:
# they must be ordered. A GitHub release announcing a version that failed to
# reach npm is worse than no release at all, so `github-release` waits on
# `publish-npm` and is skipped if publishing fails.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which attests that this tarball was built
      # from this commit in this repository.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # The tag is the release's only source of truth for humans, and
      # package.json is the only one for npm. If they disagree, stop: publishing
      # 0.1.0 from a tag reading v0.2.0 produces a mismatch nobody can undo.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/axs-core/package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump the version, commit, then retag."
            exit 1
          fi

      # A release must clear exactly the same bar as any other commit.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --workspace=@gaborwnuk/axs-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Kept for the GitHub release, so the attached artifact is byte-identical
      # to what was published rather than a second, separate build.
      - name: Pack tarball for the release
        run: npm pack --workspace=@gaborwnuk/axs-core --pack-destination ./dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist-artifacts/*.tgz
          retention-days: 7

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the generated notes can diff against the last tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist-artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## @gaborwnuk/axs-core ${VERSION}"
            echo
            echo '```sh'
            echo "npm install @gaborwnuk/axs-core@${VERSION}"
            echo '```'
            echo
            echo "Published to npm with build provenance. The attached tarball is the"
            echo "artifact that was published."
          } > release-notes.md

          gh release create "$GITHUB_REF_NAME" \
            --title "axs-core ${VERSION}" \
            --notes-file release-notes.md \
            --generate-notes \
            dist-artifacts/*.tgz
