# Release: cut a GitHub release when a version tag is pushed.
#
# Publishing to npm is deliberately NOT automated here, because an automation
# token has to be rotated every 90 days and a long-lived publish credential
# sitting in repository secrets is a bigger liability than the convenience is
# worth. The manual runbook, so it lives next to the thing it describes:
#
#   1. npm version patch --workspace=@gaborwnuk/axs-core   # or minor / major
#   2. npm run check                                       # same gate as CI
#   3. npm pack --dry-run --workspace=@gaborwnuk/axs-core  # inspect the tarball
#   4. commit, push, then publish, THEN tag — the generated release notes
#      contain an install command, so the version must exist on the registry
#      before the tag creates the release.
#   5. npm publish --workspace=@gaborwnuk/axs-core --otp=<code>
#   6. git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z
#
# Two things that will bite:
#
# * --workspace is required. A bare `npm publish` at the root targets
#   sram-axs-workspace, which is "private": true, and fails with EPRIVATE.
# * The account enforces 2FA for writes, so --otp is required and a successful
#   `npm whoami` proves nothing about publish rights. Without it:
#     npm error 403 Two-factor authentication or granular access token with
#     npm error 403 bypass 2fa enabled is required to publish packages.
#   The bypass-2FA granular token npm suggests instead is deliberately not used
#   here: it is a standing publish credential on disk with a 90-day life, which
#   is what ruled out automated publishing in the first place.
#
# This workflow therefore needs no secrets at all: it runs on the automatic
# GITHUB_TOKEN, which is scoped to this repository and expires with the job.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the generated notes can diff against the last tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag is the release's source of truth for humans, package.json is
      # npm's. If they disagree, stop before a release exists claiming a version
      # that was never published.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/axs-core/package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump the version, commit, then retag."
            exit 1
          fi

      # A tagged release must clear the same bar as any other commit. Build
      # first: the apps resolve the library's types through its emitted
      # dist/index.d.ts, which does not exist on a clean checkout.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The same tarball `npm publish` would upload, attached so the release is
      # inspectable without trusting the registry copy.
      #
      # `--pack-destination` does not create the directory, it only writes into
      # it, so without the mkdir npm fails with ENOENT on the .tgz path.
      - name: Pack tarball
        run: |
          mkdir -p dist-artifacts
          npm pack --workspace=@gaborwnuk/axs-core --pack-destination ./dist-artifacts
          ls -l dist-artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## @gaborwnuk/axs-core ${VERSION}"
            echo
            echo '```sh'
            echo "npm install @gaborwnuk/axs-core@${VERSION}"
            echo '```'
            echo
            echo "The attached tarball is the artifact built from this tag."
          } > release-notes.md

          gh release create "$GITHUB_REF_NAME" \
            --title "axs-core ${VERSION}" \
            --notes-file release-notes.md \
            --generate-notes \
            dist-artifacts/*.tgz
