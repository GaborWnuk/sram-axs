# Release: cut a GitHub release when a version tag is pushed.
#
#     npm version minor --workspace=@gaborwnuk/axs-core
#     git commit -am "release: axs-core 0.2.0"
#     git tag v0.2.0 && git push origin main --tags
#
# Publishing to npm is deliberately NOT automated here. It is done by hand (see
# RELEASING.md), because an npm automation token has to be rotated every 90 days
# and a long-lived publish credential sitting in repository secrets is a bigger
# liability than the convenience is worth.
#
# This workflow therefore needs no secrets at all: it runs on the automatic
# GITHUB_TOKEN, which is scoped to this repository and expires with the job.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the generated notes can diff against the last tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag is the release's source of truth for humans, package.json is
      # npm's. If they disagree, stop before a release exists claiming a version
      # that was never published.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/axs-core/package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump the version, commit, then retag."
            exit 1
          fi

      # A tagged release must clear the same bar as any other commit.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The same tarball `npm publish` would upload, attached so the release is
      # inspectable without trusting the registry copy.
      - name: Pack tarball
        run: npm pack --workspace=@gaborwnuk/axs-core --pack-destination ./dist-artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## @gaborwnuk/axs-core ${VERSION}"
            echo
            echo '```sh'
            echo "npm install @gaborwnuk/axs-core@${VERSION}"
            echo '```'
            echo
            echo "The attached tarball is the artifact built from this tag."
          } > release-notes.md

          gh release create "$GITHUB_REF_NAME" \
            --title "axs-core ${VERSION}" \
            --notes-file release-notes.md \
            --generate-notes \
            dist-artifacts/*.tgz
